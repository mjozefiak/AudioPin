name: Release

# Push a tag like v1.0.0 to build AudioPin.dmg and publish a GitHub Release.
# Run it manually (workflow_dispatch) to build the DMG as a workflow artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # AudioPin needs the macOS 27 SDK and Swift 6.4 (Xcode 27). GitHub's Xcode 27 image is
    # arm64 and currently in public preview; switch to a macos-27 label once it is GA.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          swift --version
          sw_vers

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $VERSION in Resources/Info.plist"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Checksum
        id: sum
        run: |
          cd dist
          shasum -a 256 AudioPin.dmg | tee AudioPin.dmg.sha256
          echo "sha256=$(cut -d' ' -f1 AudioPin.dmg.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: AudioPin-dmg
          path: |
            dist/AudioPin.dmg
            dist/AudioPin.dmg.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.sum.outputs.sha256 }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          1. Download **AudioPin.dmg** below and open it.
          2. Drag **AudioPin** onto the **Applications** folder.
          3. Open AudioPin from Applications. A pin icon appears in the menu bar.

          Requires macOS 27 or later on Apple silicon.

          ## First launch: Gatekeeper

          AudioPin is free and open source, so it is ad-hoc signed and **not notarized** by Apple.
          The first time you open it, macOS blocks it. To allow it once:

          1. Open AudioPin and close the warning.
          2. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to the AudioPin message, then confirm.

          Right-click → Open no longer skips this check on current macOS. Alternatively, in Terminal:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/AudioPin.app
          \`\`\`

          You can also build AudioPin from source: see the [README](https://github.com/${GITHUB_REPOSITORY}#installation).

          SHA-256 of \`AudioPin.dmg\`: \`${SHA256}\`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/AudioPin.dmg dist/AudioPin.dmg.sha256 \
            --verify-tag \
            --title "AudioPin ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
